name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Check card syntax
        run: node --check custom_components/drying_pilot/frontend/drying-pilot-card.js

  logic:
    name: scenario simulation (without Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest
      - name: Run calculation, text and scenario tests
        run: python -m pytest -v tests --ignore=tests/ha
